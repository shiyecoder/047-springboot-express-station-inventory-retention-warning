<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 驿通快递驿站</title>
<link rel="stylesheet" href="../mock.css">
<style></style></head>
<body><div class="login-wrap">
  <div class="login-left">
    <div class="logo"><span class="mk">驿</span>驿通快递驿站 · 站点运营平台</div>
    <div style="flex:1;max-height:170px"></div>
    <h2>每一件快件<br>都有明确的去向</h2>
    <p>从批次交接、扫码上架到取件核验与滞留催取，把站内每一件包裹的流转记录在案。<br>今天的在库件，明天就该有它的主人。</p>
    <div class="stats">
      <div><b>1,264</b><span>当前在库</span></div>
      <div><b>428</b><span>今日入库</span></div>
      <div><b>77%</b><span>货架占用</span></div>
      <div><b>87</b><span>滞留待处理</span></div>
    </div>
    <div class="barcode-deco"><i style="height:30%"></i><i style="height:67%"></i><i style="height:34%"></i><i style="height:71%"></i><i style="height:38%"></i><i style="height:75%"></i><i style="height:42%"></i><i style="height:79%"></i><i style="height:46%"></i><i style="height:83%"></i><i style="height:50%"></i><i style="height:87%"></i><i style="height:54%"></i><i style="height:91%"></i><i style="height:58%"></i><i style="height:95%"></i><i style="height:62%"></i><i style="height:99%"></i><i style="height:66%"></i><i style="height:33%"></i><i style="height:70%"></i><i style="height:37%"></i><i style="height:74%"></i><i style="height:41%"></i><i style="height:78%"></i><i style="height:45%"></i><i style="height:82%"></i><i style="height:49%"></i><i style="height:86%"></i><i style="height:53%"></i><i style="height:90%"></i><i style="height:57%"></i><i style="height:94%"></i><i style="height:61%"></i><i style="height:98%"></i><i style="height:65%"></i><i style="height:32%"></i><i style="height:69%"></i><i style="height:36%"></i><i style="height:73%"></i><i style="height:40%"></i><i style="height:77%"></i><i style="height:44%"></i><i style="height:81%"></i><i style="height:48%"></i><i style="height:85%"></i></div>
  </div>
  <div class="login-right">
    <form class="login-form">
      <h1>登录站点工作台</h1>
      <div class="tip">使用驿站分配的账号登录，账号与站点绑定</div>
      <div class="fi"><label>账号 / 工号</label><input value="manager01" placeholder="请输入账号"></div>
      <div class="fi"><label>密码</label><input type="password" value="123456" placeholder="请输入密码"></div>
      <div class="fi" style="display:flex;gap:10px">
        <div style="flex:1"><label>验证码</label><input value="7K2M" placeholder="验证码"></div>
        <div style="width:104px;height:42px;border:1px solid #DCE5EC;border-radius:6px;display:grid;place-items:center;
             font-size:16px;letter-spacing:.22em;color:#0F3B5D;background:#F4F8FB;font-weight:600">7K2M</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#5C6B78;margin:6px 0 18px">
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" checked style="height:auto;width:auto">记住本站</label>
        <a href="#">忘记密码？联系站点负责人</a>
      </div>
      <button class="btn primary" type="button">登 录</button>
      <div class="demo">
        <b style="color:#16232E">演示账号</b>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:4px">
          <span>负责人 manager01</span><span style="color:#16232E">123456</span>
          <span>员工 staff01</span><span style="color:#16232E">123456</span>
          <span>快递员 courier01</span><span style="color:#16232E">123456</span>
          <span>管理员 admin</span><span style="color:#16232E">admin123</span>
        </div>
        <div style="margin-top:4px">收件人端用手机号 + 取件码直接查询，无需登录</div>
      </div>
    </form>
  </div>
</div></body></html>
